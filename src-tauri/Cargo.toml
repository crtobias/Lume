[package]
name = "lume"
version = "0.1.0"
description = "lume — lightweight code editor"
authors = ["lume"]
edition = "2021"

[lib]
name = "lume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "process", "macros", "rt-multi-thread", "sync"] }
anyhow = "1"
thiserror = "1"
portable-pty = "0.9"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
